name: Windows build and runtime test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            platforms/desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix platforms/desktop --ignore-scripts
      - run: npm run build:windows
      - name: Run packaged Windows app
        shell: pwsh
        run: |
          $exe = Get-Item dist/SimFarm-V0-Windows.exe
          $output = Join-Path $env:GITHUB_WORKSPACE '.build/windows-test'
          $process = Start-Process -FilePath $exe.FullName -ArgumentList @('--self-test', "--test-output=$output") -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw "Windows runtime test timed out" }
          if ($process.ExitCode -ne 0) { throw "Windows app exited with $($process.ExitCode)" }
          $result = Get-Content "$output/result.json" -Raw | ConvertFrom-Json
          if (-not $result.success) { throw $result.message }
          $result | ConvertTo-Json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SimFarm-Windows-x64
          path: |
            dist/SimFarm-V0-Windows.exe
            dist/SimFarm-V0-Windows-x64.zip
            .build/windows-test/
          if-no-files-found: error
          include-hidden-files: true
