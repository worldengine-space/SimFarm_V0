name: iOS builds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios.yml'
      - 'platforms/ios/**'
      - 'scripts/**'
      - 'src/**'
      - 'assets/**'
      - 'data/**'
      - '*.js'
      - '*.html'
      - '*.css'
      - '*.webmanifest'
      - 'package*.json'
  pull_request:
permissions:
  contents: read
jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      matrix:
        target: [simulator, device]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: brew install xcodegen
      - run: bash scripts/build-ios.sh ${{ matrix.target }}
      - name: Launch on an iPhone simulator
        if: matrix.target == 'simulator'
        run: |
          simulator_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(d["udid"] for devices in json.load(sys.stdin)["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          xcrun simctl install "$simulator_id" build/ios-simulator/Build/Products/Release-iphonesimulator/SimFarm.app
          xcrun simctl launch "$simulator_id" space.worldengine.simfarm --self-test
          app_data=$(xcrun simctl get_app_container "$simulator_id" space.worldengine.simfarm data)
          for attempt in $(seq 1 120); do
            if [ -f "$app_data/Documents/smoke.json" ]; then break; fi
            sleep 2
          done
          xcrun simctl io "$simulator_id" screenshot dist/SimFarm-iPhone-simulator.png
          cp "$app_data/Documents/smoke.json" dist/SimFarm-iPhone-smoke.json
          cat dist/SimFarm-iPhone-smoke.json
          python3 -c 'import json; result=json.load(open("dist/SimFarm-iPhone-smoke.json")); assert result["status"] == "passed", result' 
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SimFarm-iOS-${{ matrix.target }}-unsigned
          path: |
            dist/SimFarm-iOS-${{ matrix.target }}-unsigned.zip
            dist/SimFarm-iOS-${{ matrix.target }}-unsigned.ipa
            dist/SimFarm-iPhone-simulator.png
            dist/SimFarm-iPhone-smoke.json
          if-no-files-found: error
