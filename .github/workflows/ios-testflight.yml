name: Publish iPhone build to TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: App version (for example 0.1.0)
        required: true
        default: '0.1.0'
        type: string
      build_number:
        description: Positive integer greater than the last uploaded build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: simfarm-testflight
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release configuration
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os, re
          required = ('APPLE_TEAM_ID', 'APPLE_CERTIFICATE_BASE64', 'APPLE_CERTIFICATE_PASSWORD',
                      'APPLE_PROVISIONING_PROFILE_BASE64', 'APP_STORE_CONNECT_ISSUER_ID',
                      'APP_STORE_CONNECT_KEY_ID', 'APP_STORE_CONNECT_PRIVATE_KEY')
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit('Configure GitHub Actions secrets first: ' + ', '.join(missing))
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', os.environ['APP_VERSION']):
              raise SystemExit('Version must have three numeric components, such as 0.1.0')
          if not re.fullmatch(r'[1-9][0-9]*', os.environ['BUILD_NUMBER']):
              raise SystemExit('Build number must be a positive integer')
          PY
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Generate native project and offline game bundle
        run: |
          brew install xcodegen
          npm run build
          node scripts/bundle-ios.mjs
          xcodegen generate --spec platforms/ios/project.yml
      - name: Install signing identity and validate provisioning profile
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          certificate_path="$RUNNER_TEMP/distribution.p12"
          profile_path="$RUNNER_TEMP/SimFarm.mobileprovision"
          keychain_path="$RUNNER_TEMP/simfarm-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 3600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security cms -D -i "$profile_path" > "$RUNNER_TEMP/profile.plist"
          python3 - <<'PY'
          import datetime, hashlib, os, pathlib, plistlib, shutil, subprocess, uuid
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          profile = plistlib.loads((temp / 'profile.plist').read_bytes())
          team = os.environ['APPLE_TEAM_ID']
          bundle = 'space.worldengine.simfarm'
          entitlements = profile['Entitlements']
          assert team in profile['TeamIdentifier'], 'Profile belongs to another Apple team'
          prefix = profile['ApplicationIdentifierPrefix'][0]
          assert entitlements['application-identifier'] == prefix + '.' + bundle, 'Wrong profile bundle ID'
          assert not entitlements.get('get-task-allow'), 'Development profiles cannot be uploaded'
          assert not profile.get('ProvisionedDevices'), 'Use an App Store Connect profile, not Ad Hoc'
          assert not profile.get('ProvisionsAllDevices'), 'Enterprise profiles cannot be uploaded'
          assert profile['ExpirationDate'] > datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None), 'Profile has expired'
          profile_id = str(uuid.UUID(profile['UUID'])).upper()
          identities = subprocess.check_output(['security', 'find-identity', '-v', '-p', 'codesigning',
                                               str(temp / 'simfarm-signing.keychain-db')], text=True)
          certificate = next((hashlib.sha1(cert).hexdigest().upper() for cert in profile['DeveloperCertificates']
                              if hashlib.sha1(cert).hexdigest().upper() in identities), None)
          assert certificate, 'Profile does not include the imported valid signing certificate and private key'
          # Xcode 16+ and older Xcode use different profile directories.
          for directory in ('Library/Developer/Xcode/UserData/Provisioning Profiles',
                            'Library/MobileDevice/Provisioning Profiles'):
              destination = pathlib.Path.home() / directory
              destination.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(temp / 'SimFarm.mobileprovision', destination / (profile_id + '.mobileprovision'))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'PROFILE_UUID={profile_id}\nSIGNING_CERTIFICATE={certificate}\n')
          options = {'method': 'app-store-connect', 'destination': 'export', 'teamID': team,
                     'signingStyle': 'manual', 'signingCertificate': certificate,
                     'provisioningProfiles': {bundle: profile_id},
                     'manageAppVersionAndBuildNumber': False, 'uploadSymbols': True}
          (temp / 'ExportOptions.plist').write_bytes(plistlib.dumps(options))
          PY
      - name: Archive and export signed IPA
        run: |
          xcodebuild -project platforms/ios/SimFarm.xcodeproj -scheme SimFarm \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SimFarm.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_CERTIFICATE" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" archive
          app_path="$RUNNER_TEMP/SimFarm.xcarchive/Products/Applications/SimFarm.app"
          test -f "$app_path/Web/index.html"
          test -f "$app_path/Web/game.js"
          codesign --verify --deep --strict "$app_path"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SimFarm.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ios-export"
          test -f "$RUNNER_TEMP/ios-export/SimFarm.ipa"
      - name: Upload signed build to Apple TestFlight
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ runner.temp }}/ios-export/SimFarm.ipa
          app-type: ios
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      - name: Report upload
        run: |
          echo '### SimFarm uploaded to App Store Connect' >> "$GITHUB_STEP_SUMMARY"
          echo 'Finish processing, export compliance, external beta review, and the public invitation link in App Store Connect. See platforms/ios/DISTRIBUTION.md.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/simfarm-signing.keychain-db" || true
          if [[ -n "${PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/SimFarm.mobileprovision" "$RUNNER_TEMP/profile.plist"
